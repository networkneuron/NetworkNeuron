      <stop offset="0" stop-color="#FF643D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF643D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF643D" stop-opacity="0"/>
