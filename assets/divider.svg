    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFC08A" stop-opacity="1"/>
